<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Doooit</title>
<meta name="theme-color" content="#0F0F0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Doooit">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F0F0E; --surface:#1A1916; --surface2:#23211C; --line:#2E2B24;
  --cream:#F4EFE3; --muted:#9B937F; --gold:#D4A93C;
  --green:#5BBB7B; --amber:#E8B33C; --red:#E26D5C;
  --radius:18px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--ink); color:var(--cream);
  font-family:'Inter',system-ui,-apple-system,sans-serif; font-size:15px;
  max-width:520px; margin:0 auto; min-height:100vh; position:relative;
}
.num{font-family:'Space Grotesk',monospace}
#app{padding:18px 16px 110px}
/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.logo{font-family:'Space Grotesk';font-weight:700;font-size:22px;letter-spacing:-0.5px}
.logo span{color:var(--gold)}
.monthnav{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 10px}
.monthnav button{background:none;border:none;color:var(--gold);font-size:16px;cursor:pointer;padding:0 4px}
.monthnav .m{font-family:'Space Grotesk';font-weight:600;font-size:13px;min-width:74px;text-align:center}
/* ---------- hero ---------- */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 18px 18px;text-align:center;margin-bottom:12px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-40% -20% auto;height:120px;background:radial-gradient(ellipse at top,rgba(212,169,60,.14),transparent 70%);pointer-events:none}
.ringwrap{position:relative;width:190px;height:190px;margin:0 auto 8px}
.ringwrap svg{transform:rotate(-90deg)}
.ringcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ringcenter .lbl{font-size:11px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
.ringcenter .val{font-family:'Space Grotesk';font-weight:700;font-size:27px;letter-spacing:-1px}
.ringcenter .sub{font-size:11px;color:var(--muted)}
.legend{display:flex;justify-content:center;gap:14px;margin-top:6px;flex-wrap:wrap}
.legend div{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:6px 14px;font-size:12px;font-weight:600;margin-top:12px}
.pill.sihat{background:rgba(91,187,123,.13);color:var(--green)}
.pill.sederhana{background:rgba(232,179,60,.13);color:var(--amber)}
.pill.taksihat{background:rgba(226,109,92,.13);color:var(--red)}
/* ---------- cards ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px}
.card .clbl{font-size:11px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-bottom:5px}
.card .cval{font-family:'Space Grotesk';font-weight:700;font-size:19px}
.card .csub{font-size:11px;color:var(--muted);margin-top:3px}
.sec{margin:18px 0 10px;display:flex;align-items:baseline;justify-content:space-between}
.sec h2{font-family:'Space Grotesk';font-size:15px;font-weight:600}
.sec .more{font-size:12px;color:var(--gold);cursor:pointer}
/* category bars */
.catrow{display:flex;align-items:center;gap:10px;padding:8px 0}
.catrow .ic{width:34px;height:34px;border-radius:11px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.catrow .mid{flex:1;min-width:0}
.catrow .nm{font-size:13px;font-weight:500;display:flex;justify-content:space-between;margin-bottom:5px}
.catrow .nm b{font-family:'Space Grotesk';font-weight:600}
.bar{height:5px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--gold)}
/* commitments */
.cmrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cmrow:last-child{border-bottom:none}
.cmrow .st{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.cmrow .nm{flex:1;font-size:13.5px}
.cmrow .nm small{display:block;color:var(--muted);font-size:11px;margin-top:1px}
.cmrow .amt{font-family:'Space Grotesk';font-weight:600;font-size:13.5px;margin-right:6px}
.btn-mini{background:rgba(212,169,60,.13);color:var(--gold);border:none;border-radius:9px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter'}
.btn-mini:disabled{opacity:.35}
/* transactions */
.daygroup{margin-bottom:14px}
.daylbl{font-size:11px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-bottom:6px;display:flex;justify-content:space-between}
.tx{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:7px;cursor:pointer}
.tx .ic{width:36px;height:36px;border-radius:11px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;position:relative}
.tx .ic .rcpt{position:absolute;bottom:-3px;right:-3px;font-size:10px}
.tx .mid{flex:1;min-width:0}
.tx .it{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .ct{font-size:11px;color:var(--muted);margin-top:1px;display:flex;gap:6px;align-items:center}
.tag{font-size:9.5px;font-weight:700;letter-spacing:.4px;padding:2px 6px;border-radius:6px}
.tag.maybe{background:rgba(232,179,60,.15);color:var(--amber)}
.tx .amt{font-family:'Space Grotesk';font-weight:600;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:34px 20px;font-size:13.5px;line-height:1.6}
.empty .big{font-size:34px;margin-bottom:8px}
/* tax tab */
.relief{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:10px}
.relief .rh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.relief .rn{font-size:13.5px;font-weight:600}
.relief .rc{font-size:11px;color:var(--muted)}
.relief .rv{display:flex;justify-content:space-between;font-size:12px;margin-top:7px;color:var(--muted)}
.relief .rv b{color:var(--cream);font-family:'Space Grotesk'}
.note{background:rgba(232,179,60,.07);border:1px solid rgba(232,179,60,.2);border-radius:14px;padding:13px;font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:14px}
.note b{color:var(--amber)}
/* settings */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=number],input[type=date]{
  width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:12px;
  padding:12px 13px;color:var(--cream);font-size:15px;font-family:'Inter';outline:none;
}
input:focus{border-color:var(--gold)}
.btn{width:100%;background:var(--gold);color:#171510;border:none;border-radius:13px;padding:14px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:'Inter'}
.btn.ghost{background:var(--surface2);color:var(--cream);border:1px solid var(--line);font-weight:600}
.btn.danger{background:rgba(226,109,92,.12);color:var(--red);border:1px solid rgba(226,109,92,.3)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.row3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:9px}
/* bottom nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
  background:rgba(15,15,14,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:9px 6px calc(9px + env(safe-area-inset-bottom));z-index:40}
.nav button{background:none;border:none;color:var(--muted);font-size:10.5px;font-family:'Inter';font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 12px;border-radius:12px}
.nav button .nic{font-size:19px}
.nav button.on{color:var(--gold)}
/* fab */
.fab{position:fixed;bottom:84px;right:calc(50% - 244px);width:58px;height:58px;border-radius:50%;
  background:var(--gold);color:#171510;border:none;font-size:30px;font-weight:400;cursor:pointer;z-index:41;
  box-shadow:0 8px 24px rgba(212,169,60,.35);display:flex;align-items:center;justify-content:center;line-height:1}
@media(max-width:540px){.fab{right:18px}}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none}
.overlay.show{display:block}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(105%);width:100%;max-width:520px;
  background:var(--surface);border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:none;
  z-index:51;padding:10px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;
  transition:transform .28s cubic-bezier(.3,.9,.3,1)}
.sheet.show{transform:translateX(-50%) translateY(0)}
.grab{width:38px;height:4px;background:var(--line);border-radius:99px;margin:4px auto 14px}
.sheet h3{font-family:'Space Grotesk';font-size:17px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.amtbig{width:100%;background:none;border:none;border-bottom:2px solid var(--line);color:var(--cream);
  font-family:'Space Grotesk';font-size:40px;font-weight:700;text-align:center;padding:6px 0 10px;outline:none;margin-bottom:16px}
.amtbig:focus{border-color:var(--gold)}
.amtbig::placeholder{color:#403C32}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:4px}
.chip{background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:8px 12px;font-size:12px;cursor:pointer;color:var(--cream);font-family:'Inter'}
.chip.on{background:rgba(212,169,60,.16);border-color:var(--gold);color:var(--gold);font-weight:600}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;background:none;border:none;border-radius:9px;padding:9px 0;font-size:12.5px;color:var(--muted);cursor:pointer;font-family:'Inter';font-weight:600}
.seg button.on{background:var(--ink);color:var(--gold)}
.switchrow{display:flex;align-items:center;justify-content:space-between;background:var(--surface2);border-radius:12px;padding:12px 13px;margin-bottom:14px}
.switchrow .sl{font-size:13px}
.switchrow .sl small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.sw{width:46px;height:26px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:.2s;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:.2s}
.sw.on{background:var(--amber)}
.sw.on::after{left:23px;background:#171510}
.rcptbtn{display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px dashed var(--line);border-radius:12px;padding:12px 13px;cursor:pointer;margin-bottom:14px;font-size:13px;color:var(--muted)}
.rcptbtn img{width:42px;height:42px;object-fit:cover;border-radius:9px}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:20px}
.viewer.show{display:flex}
.viewer img{max-width:100%;max-height:80vh;border-radius:14px}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--gold);
  color:var(--cream);border-radius:99px;padding:9px 18px;font-size:13px;z-index:70;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
.hide{display:none!important}
.spin{text-align:center;padding:60px 0;color:var(--muted);font-size:13px}
.mb14{margin-bottom:14px}.mb8{margin-bottom:8px}
</style>
</head>
<body>
<div id="app"><div class="spin">Memuatkan Doooit…</div></div>

<button class="fab hide" id="fab" onclick="openAdd()">+</button>
<nav class="nav hide" id="nav">
  <button data-t="home" class="on" onclick="go('home')"><span class="nic">◉</span>Utama</button>
  <button data-t="rekod" onclick="go('rekod')"><span class="nic">☰</span>Rekod</button>
  <button data-t="cukai" onclick="go('cukai')"><span class="nic">▦</span>Cukai</button>
  <button data-t="set" onclick="go('set')"><span class="nic">✦</span>Tetapan</button>
</nav>

<div class="overlay" id="ovl" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="viewer" id="viewer" onclick="this.classList.remove('show')"><img id="vimg"><div style="color:var(--muted);font-size:12px">Tap untuk tutup</div></div>
<div class="toast" id="toast"></div>
<input type="file" accept="image/*" capture="environment" id="camin" class="hide">

<script>
/* ================= DATA ================= */
const CATS=[
 {n:'Makan & Minum',j:'Keperluan',t:null,e:'🍜'},
 {n:'Groceries',j:'Keperluan',t:null,e:'🛒'},
 {n:'Minyak & Transport',j:'Keperluan',t:null,e:'⛽'},
 {n:'Tol & Parking',j:'Keperluan',t:null,e:'🅿️'},
 {n:'Sewa / Rumah',j:'Komitmen',t:null,e:'🏠'},
 {n:'Bil & Utiliti',j:'Komitmen',t:null,e:'💡'},
 {n:'Internet & Telefon',j:'Komitmen',t:'Gaya Hidup',e:'📶'},
 {n:'Loan / Hutang',j:'Komitmen',t:null,e:'🏦'},
 {n:'Insurans / Takaful',j:'Komitmen',t:'Insurans',e:'🛡️'},
 {n:'Kesihatan / Medical',j:'Keperluan',t:'Perubatan',e:'🩺'},
 {n:'Buku & Belajar',j:'Kehendak',t:'Gaya Hidup',e:'📚'},
 {n:'Gadget & Elektronik',j:'Kehendak',t:'Gaya Hidup',e:'📱'},
 {n:'Sukan & Gym',j:'Kehendak',t:'Sukan',e:'⚽'},
 {n:'Shopping & Pakaian',j:'Kehendak',t:null,e:'🛍️'},
 {n:'Hiburan & Subs',j:'Kehendak',t:null,e:'🎬'},
 {n:'Keluarga & Hadiah',j:'Kehendak',t:null,e:'🎁'},
 {n:'Sedekah / Zakat',j:'Keperluan',t:'Zakat / Derma',e:'🤲'},
 {n:'Lain-lain',j:'Kehendak',t:null,e:'📦'},
];
const RELIEFS={'Gaya Hidup':{cap:2500,d:'Buku, telefon, internet, peralatan sukan'},
 'Sukan':{cap:1000,d:'Tambahan aktiviti & peralatan sukan'},
 'Perubatan':{cap:1000,d:'Check-up penuh, mental health (dalam had perubatan)'},
 'Insurans':{cap:3000,d:'Ikut jenis polisi — nyawa / medical'},
 'Zakat / Derma':{cap:null,d:'Zakat = rebat; derma ikut syarat institusi'}};
const JCOLOR={'Keperluan':'#5BBB7B','Kehendak':'#E26D5C','Komitmen':'#D4A93C'};

let S={income:0,expenses:[],commitments:[],sync:{url:''}};
let tab='home', month=new Date().toISOString().slice(0,7);
let draft=null, saveTimer=null;

const $=id=>document.getElementById(id);
const fmt=n=>'RM '+(+n||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=n=>'RM '+Math.round(+n||0).toLocaleString('en-MY');
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const catOf=n=>CATS.find(c=>c.n===n)||CATS[CATS.length-1];
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MNAMES=['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'];
const mLabel=m=>{const[y,mm]=m.split('-');return MNAMES[+mm-1]+' '+y};
const toast=t=>{const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)};

/* ============ STORAGE: localStorage + Google Drive sync (Apps Script) ============ */
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}

async function load(){
  const r=lsGet('doooit-main');
  if(r){try{S=JSON.parse(r)}catch(e){}}
  if(!S.sync)S.sync={url:''};
  $('nav').classList.remove('hide');$('fab').classList.remove('hide');
  render();
  if(S.sync.url)pullSync(false);
}
function save(){
  S.updated=Date.now();
  if(!lsSet('doooit-main',JSON.stringify(S)))toast('Storan phone penuh — buat backup & padam data lama');
  clearTimeout(saveTimer);
  if(S.sync&&S.sync.url)saveTimer=setTimeout(pushSync,1200);
}
async function pushSync(){
  try{await fetch(S.sync.url,{method:'POST',body:JSON.stringify({action:'save',main:JSON.stringify(S)})});}
  catch(e){toast('Sync ke Drive gagal — check internet')}
}
async function pullSync(silent){
  try{
    const res=await fetch(S.sync.url+'?action=load');
    const txt=await res.text();
    if(txt&&txt.trim()&&txt.trim()!=='{}'){
      const remote=JSON.parse(txt);
      if((remote.updated||0)>(S.updated||0)){
        remote.sync=S.sync;S=remote;lsSet('doooit-main',JSON.stringify(S));render();
        if(!silent)toast('Data terkini ditarik dari Drive ☁️');
      }else if(!silent)toast('Data phone dah terkini ✓');
    }else if(!silent)toast('Drive masih kosong — data akan naik bila kau simpan');
  }catch(e){if(!silent)toast('Tak dapat hubungi Drive — check URL/internet')}
}
async function connectDrive(){
  let url=$('syncIn').value.trim();
  if(!url.startsWith('https://script.google.com/')){toast('URL tak nampak macam Apps Script');return}
  toast('Menguji sambungan…');
  try{
    const res=await fetch(url+'?action=load');
    await res.text();
    S.sync.url=url;save();pushSync();render();toast('Tersambung ke Drive ✓');
  }catch(e){toast('Gagal sambung — pastikan deploy "Anyone" & URL betul')}
}
async function saveReceipt(id,dataUrl){
  const ok=lsSet('doooit-rcpt-'+id,dataUrl);
  if(S.sync&&S.sync.url){
    try{await fetch(S.sync.url,{method:'POST',body:JSON.stringify({action:'receipt',id:id,data:dataUrl})});}
    catch(e){toast('Resit tak naik ke Drive — cuba lagi nanti')}
  }else if(!ok)toast('Resit tak muat dalam storan phone — sambung Drive untuk ruang lebih');
}
async function getReceipt(id){
  const l=lsGet('doooit-rcpt-'+id);if(l)return l;
  if(S.sync&&S.sync.url){
    try{const r=await fetch(S.sync.url+'?action=receipt&id='+id);const t=await r.text();
      if(t&&t.startsWith('data:image')){lsSet('doooit-rcpt-'+id,t);return t}}catch(e){}
  }
  return null;
}
async function delReceipt(id){try{localStorage.removeItem('doooit-rcpt-'+id)}catch(e){}}

/* ================= CALC ================= */
const monthEx=()=>S.expenses.filter(e=>e.date&&e.date.startsWith(month));
const yearEx=()=>S.expenses.filter(e=>e.date&&e.date.startsWith(month.slice(0,4)));
function sums(list){const o={total:0,Keperluan:0,Kehendak:0,Komitmen:0};list.forEach(e=>{o.total+=e.amt;o[e.jenis]=(o[e.jenis]||0)+e.amt});return o}
function health(s){if(s.total<=0)return null;const p=s.Kehendak/s.total;
  if(p<=.30)return{c:'sihat',t:'SIHAT — kehendak terkawal',p};
  if(p<=.45)return{c:'sederhana',t:'SEDERHANA — jaga sikit',p};
  return{c:'taksihat',t:'TAK SIHAT — kehendak tinggi',p}}

/* ================= RENDER ================= */
function go(t){tab=t;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render()}
function shiftMonth(d){const[y,m]=month.split('-').map(Number);const dt=new Date(y,m-1+d,1);month=dt.toISOString().slice(0,7);render()}

function render(){
  const a=$('app');
  if(tab==='home')a.innerHTML=vHome();
  else if(tab==='rekod')a.innerHTML=vRekod();
  else if(tab==='cukai')a.innerHTML=vCukai();
  else a.innerHTML=vSet();
}

function header(){return `<div class="top"><div class="logo">doo<span>oit</span></div>
  <div class="monthnav"><button onclick="shiftMonth(-1)">‹</button><div class="m">${mLabel(month)}</div><button onclick="shiftMonth(1)">›</button></div></div>`}

function ringSVG(s){
  const R=82,C=2*Math.PI*R,inc=S.income||0;
  const segs=['Keperluan','Komitmen','Kehendak'];
  let off=0,arcs='';
  const base=inc>0?inc:(s.total||1);
  segs.forEach(j=>{const v=s[j]||0;if(v<=0)return;const len=Math.min(v/base,1)*C;
    arcs+=`<circle cx="95" cy="95" r="${R}" fill="none" stroke="${JCOLOR[j]}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${len} ${C}" stroke-dashoffset="${-off}"/>`;off+=len;});
  const baki=inc-s.total;
  return `<div class="ringwrap"><svg width="190" height="190" viewBox="0 0 190 190">
    <circle cx="95" cy="95" r="${R}" fill="none" stroke="var(--surface2)" stroke-width="11"/>${arcs}</svg>
    <div class="ringcenter"><div class="lbl">Baki ${inc>0?'':'(set gaji dulu)'}</div>
    <div class="val" style="color:${baki<0?'var(--red)':'var(--cream)'}">${fmt0(inc>0?baki:-s.total).replace('RM -','-RM ')}</div>
    <div class="sub">belanja ${fmt0(s.total)}${inc>0?' / '+fmt0(inc):''}</div></div></div>`;
}

function vHome(){
  const ex=monthEx(),s=sums(ex),h=health(s);
  const cm=S.commitments||[];
  const cmTotal=cm.reduce((a,c)=>a+(+c.amt||0),0);
  const paidIds=new Set(ex.filter(e=>e.cmId).map(e=>e.cmId));
  const taxY=yearEx().filter(e=>e.tax).reduce((a,e)=>a+e.amt,0);
  // top categories
  const byCat={};ex.forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+e.amt);
  const top=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxC=top.length?top[0][1]:1;

  let html=header()+`<div class="hero">${ringSVG(s)}
    <div class="legend">
      <div><span class="dot" style="background:#5BBB7B"></span>Keperluan ${fmt0(s.Keperluan)}</div>
      <div><span class="dot" style="background:#D4A93C"></span>Komitmen ${fmt0(s.Komitmen)}</div>
      <div><span class="dot" style="background:#E26D5C"></span>Kehendak ${fmt0(s.Kehendak)}</div>
    </div>
    ${h?`<div class="pill ${h.c}">● ${h.t} (${Math.round(h.p*100)}%)</div>`:''}
  </div>
  <div class="grid2">
    <div class="card"><div class="clbl">Komitmen Bulanan</div><div class="cval num">${fmt0(cmTotal)}</div>
      <div class="csub">${paidIds.size}/${cm.length} dah dibayar</div></div>
    <div class="card"><div class="clbl">Tax "Maybe" ${month.slice(0,4)}</div><div class="cval num" style="color:var(--amber)">${fmt0(taxY)}</div>
      <div class="csub">simpan resit, mungkin boleh claim</div></div>
  </div>`;

  if(S.income<=0)html+=`<div class="note"><b>Mula sini:</b> pergi Tetapan ✦ dan masukkan gaji bulanan kau supaya baki & ring atas tu hidup.</div>`;

  if(cm.length){
    html+=`<div class="sec"><h2>Komitmen bulan ini</h2><span class="more" onclick="go('set')">Edit</span></div><div class="card">`;
    cm.forEach(c=>{const paid=paidIds.has(c.id);
      html+=`<div class="cmrow"><span class="st" style="background:${paid?'var(--green)':'var(--line)'}"></span>
        <div class="nm">${esc(c.name)}<small>${c.day?c.day+'hb · ':''}${esc(c.cat)}</small></div>
        <div class="amt num">${fmt0(c.amt)}</div>
        <button class="btn-mini" ${paid?'disabled':''} onclick="payCm('${c.id}')">${paid?'✓':'Bayar'}</button></div>`;});
    html+=`</div>`;
  }

  if(top.length){
    html+=`<div class="sec"><h2>Top kategori</h2><span class="more" onclick="go('rekod')">Semua rekod</span></div><div class="card">`;
    top.forEach(([n,v])=>{const c=catOf(n);
      html+=`<div class="catrow"><div class="ic">${c.e}</div><div class="mid">
        <div class="nm"><span>${esc(n)}</span><b class="num">${fmt0(v)}</b></div>
        <div class="bar"><i style="width:${Math.round(v/maxC*100)}%"></i></div></div></div>`;});
    html+=`</div>`;
  }
  if(!ex.length)html+=`<div class="empty"><div class="big">👋</div>Belum ada rekod bulan ni.<br>Tekan butang <b style="color:var(--gold)">+</b> untuk log belanja pertama kau.</div>`;
  return html;
}

function vRekod(){
  const ex=monthEx().slice().sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);
  let html=header();
  if(!ex.length)return html+`<div class="empty"><div class="big">🗒️</div>Takde rekod untuk ${mLabel(month)}.</div>`;
  const groups={};ex.forEach(e=>{(groups[e.date]=groups[e.date]||[]).push(e)});
  Object.keys(groups).sort().reverse().forEach(d=>{
    const list=groups[d],sum=list.reduce((a,e)=>a+e.amt,0);
    const dt=new Date(d+'T00:00:00');
    html+=`<div class="daygroup"><div class="daylbl"><span>${dt.getDate()} ${MNAMES[dt.getMonth()]}</span><span class="num">${fmt0(sum)}</span></div>`;
    list.forEach(e=>{const c=catOf(e.cat);
      html+=`<div class="tx" onclick="openAdd('${e.id}')">
        <div class="ic">${c.e}${e.hasRcpt?'<span class="rcpt">📎</span>':''}</div>
        <div class="mid"><div class="it">${esc(e.item)||esc(e.cat)}</div>
        <div class="ct">${esc(e.cat)}${e.tax?'<span class="tag maybe">TAX MAYBE</span>':''}</div></div>
        <div class="amt num">${fmt(e.amt)}</div></div>`;});
    html+=`</div>`;});
  return html;
}

function vCukai(){
  const yr=month.slice(0,4);
  const list=yearEx().filter(e=>e.tax);
  const total=list.reduce((a,e)=>a+e.amt,0);
  let html=header();
  html+=`<div class="note"><b>Ini senarai "maybe", bukan pengesahan.</b> Doooit cuma kumpul belanja yang mungkin relevan untuk pelepasan cukai supaya kau tak terlepas resit. Sahkan sendiri di MyTax/LHDN bila nak file. Simpan resit 7 tahun.</div>`;
  html+=`<div class="card mb14"><div class="clbl">Jumlah "Maybe" tahun ${yr}</div><div class="cval num" style="font-size:26px;color:var(--amber)">${fmt(total)}</div></div>`;
  Object.entries(RELIEFS).forEach(([name,r])=>{
    const v=list.filter(e=>e.relief===name).reduce((a,e)=>a+e.amt,0);
    if(v<=0&&!r.cap)return;
    const pct=r.cap?Math.min(v/r.cap*100,100):0;
    html+=`<div class="relief"><div class="rh"><span class="rn">${name}</span><span class="rc">${r.cap?'had anggaran RM'+r.cap.toLocaleString():'ikut syarat'}</span></div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:8px">${r.d}</div>
      ${r.cap?`<div class="bar" style="height:7px"><i style="width:${pct}%;background:${pct>=100?'var(--green)':'var(--amber)'}"></i></div>
      <div class="rv"><span>Terkumpul <b>${fmt0(v)}</b></span><span>Baki ruang <b>${fmt0(Math.max(0,r.cap-v))}</b></span></div>`
      :`<div class="rv"><span>Terkumpul <b>${fmt0(v)}</b></span></div>`}</div>`;});
  if(list.length){
    html+=`<div class="sec"><h2>Item bertanda "Maybe"</h2></div>`;
    list.sort((a,b)=>b.date.localeCompare(a.date)).forEach(e=>{const c=catOf(e.cat);
      html+=`<div class="tx" onclick="openAdd('${e.id}')"><div class="ic">${c.e}${e.hasRcpt?'<span class="rcpt">📎</span>':''}</div>
      <div class="mid"><div class="it">${esc(e.item)||esc(e.cat)}</div><div class="ct">${e.date} · ${esc(e.relief||'')}</div></div>
      <div class="amt num">${fmt(e.amt)}</div></div>`;});
  }else html+=`<div class="empty">Belum ada item bertanda Maybe tahun ni.</div>`;
  return html;
}

function vSet(){
  const cm=S.commitments||[];
  let html=header()+`<div class="sec"><h2>Gaji & pendapatan</h2></div>
  <div class="card mb14"><div class="field"><label>Pendapatan bulanan (RM)</label>
  <input type="number" inputmode="decimal" id="incIn" value="${S.income||''}" placeholder="cth: 4000"></div>
  <button class="btn" onclick="saveIncome()">Simpan gaji</button></div>

  <div class="sec"><h2>Komitmen tetap</h2></div><div class="card mb14">`;
  if(cm.length){cm.forEach(c=>{html+=`<div class="cmrow"><div class="nm">${esc(c.name)}<small>${c.day?c.day+'hb · ':''}${fmt0(c.amt)} · ${esc(c.cat)}</small></div>
    <button class="btn-mini" style="background:rgba(226,109,92,.12);color:var(--red)" onclick="delCm('${c.id}')">Buang</button></div>`;});}
  else html+=`<div class="empty" style="padding:14px">Belum ada. Tambah sewa, loan, subscription bawah ni.</div>`;
  html+=`</div>
  <div class="card mb14"><div class="field"><label>Nama komitmen</label><input type="text" id="cmName" placeholder="cth: PTPTN"></div>
  <div class="row3 mb14">
    <div><label style="font-size:12px;color:var(--muted);display:block;margin-bottom:6px">Jumlah (RM)</label><input type="number" inputmode="decimal" id="cmAmt"></div>
    <div><label style="font-size:12px;color:var(--muted);display:block;margin-bottom:6px">Hari bulan</label><input type="number" id="cmDay" placeholder="1-31"></div>
    <div><label style="font-size:12px;color:var(--muted);display:block;margin-bottom:6px">&nbsp;</label><button class="btn" style="padding:12px" onclick="addCm()">Tambah</button></div>
  </div>
  <div class="field"><label>Kategori</label><div class="chips" id="cmCats">${CATS.filter(c=>c.j==='Komitmen').map(c=>`<span class="chip" data-c="${c.n}" onclick="pickCmCat(this)">${c.e} ${c.n}</span>`).join('')}</div></div></div>

  <div class="sec"><h2>Google Drive sync</h2></div>
  <div class="card mb14">
  ${S.sync&&S.sync.url?
    `<div style="font-size:13px;margin-bottom:12px;line-height:1.6">☁️ <b style="color:var(--green)">Tersambung</b> — data & resit auto-backup ke folder <b>Doooit</b> dalam Google Drive kau setiap kali simpan.</div>
    <button class="btn ghost mb8" onclick="pullSync(false)">Tarik data terkini dari Drive</button>
    <button class="btn danger" onclick="if(confirm('Putuskan sync? Data dalam Drive kekal, cuma tak auto-backup lagi.')){S.sync.url='';save();render()}">Putuskan sambungan</button>`
    :
    `<div style="font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:12px">Sambungkan Drive supaya data + gambar resit auto-backup ke folder <b style="color:var(--cream)">Doooit</b> dalam Google Drive kau — dan boleh restore kalau tukar phone. Ikut panduan setup yang aku bagi, lepas tu paste URL kat sini.</div>
    <div class="field"><input type="text" id="syncIn" placeholder="https://script.google.com/macros/s/…/exec"></div>
    <button class="btn" onclick="connectDrive()">Test & sambung</button>`}
  </div>

  <div class="sec"><h2>Data</h2></div>
  <div class="card"><button class="btn ghost mb8" onclick="exportCSV()">Muat turun CSV (backup)</button>
  <button class="btn danger" onclick="resetAll()">Padam semua data</button>
  <div style="font-size:11px;color:var(--muted);margin-top:10px;line-height:1.6">Data disimpan dalam phone ni (localStorage)${S.sync&&S.sync.url?' dan di-backup ke Google Drive kau':' — sambung Google Drive kat atas untuk backup automatik'}. Jangan clear browsing data tanpa backup dulu.</div></div>`;
  return html;
}

let cmCat='Loan / Hutang';
function pickCmCat(el){document.querySelectorAll('#cmCats .chip').forEach(c=>c.classList.remove('on'));el.classList.add('on');cmCat=el.dataset.c}
function saveIncome(){S.income=+($('incIn').value)||0;save();toast('Gaji disimpan');render()}
function addCm(){const n=$('cmName').value.trim(),a=+($('cmAmt').value)||0;if(!n||a<=0){toast('Isi nama & jumlah');return}
  S.commitments.push({id:uid(),name:n,amt:a,day:+($('cmDay').value)||null,cat:cmCat});save();render();toast('Komitmen ditambah')}
function delCm(id){S.commitments=S.commitments.filter(c=>c.id!==id);save();render()}
function payCm(id){const c=S.commitments.find(x=>x.id===id);if(!c)return;const cat=catOf(c.cat);
  const e={id:uid(),ts:Date.now(),date:today(),item:c.name,cat:c.cat,jenis:'Komitmen',amt:c.amt,
    tax:!!cat.t,relief:cat.t||null,note:'',hasRcpt:false,cmId:id};
  S.expenses.push(e);save();render();toast(c.name+' direkod ✓')}

/* ================= ADD / EDIT SHEET ================= */
async function openAdd(editId){
  const e=editId?S.expenses.find(x=>x.id===editId):null;
  const cat=e?catOf(e.cat):CATS[0];
  draft={id:e?e.id:null,amt:e?e.amt:'',item:e?e.item:'',cat:e?e.cat:CATS[0].n,
    jenis:e?e.jenis:CATS[0].j,date:e?e.date:today(),tax:e?e.tax:!!CATS[0].t,
    relief:e?e.relief:CATS[0].t,note:e?e.note:'',rcpt:null,hasRcpt:e?e.hasRcpt:false,cmId:e?e.cmId:null};
  renderSheet();
  $('ovl').classList.add('show');$('sheet').classList.add('show');
  if(e&&e.hasRcpt){const img=await getReceipt(e.id);if(img){draft.rcpt=img;renderSheet()}}
}
function renderSheet(){
  const d=draft,c=catOf(d.cat);
  $('sheet').innerHTML=`<div class="grab"></div>
  <h3>${d.id?'Edit rekod':'Rekod belanja'}${d.id?`<button class="btn-mini" style="background:rgba(226,109,92,.12);color:var(--red)" onclick="delExp()">Padam</button>`:''}</h3>
  <input class="amtbig" type="number" inputmode="decimal" id="dAmt" placeholder="0.00" value="${d.amt}" oninput="draft.amt=this.value">
  <div class="field"><label>Item</label><input type="text" id="dItem" placeholder="cth: lunch mamak" value="${esc(d.item)}" oninput="draft.item=this.value"></div>
  <div class="field"><label>Kategori</label><div class="chips">${CATS.map(x=>`<span class="chip ${x.n===d.cat?'on':''}" onclick="pickCat('${x.n}')">${x.e} ${x.n}</span>`).join('')}</div></div>
  <div class="field"><label>Jenis</label><div class="seg">${['Keperluan','Kehendak','Komitmen'].map(j=>`<button class="${d.jenis===j?'on':''}" onclick="draft.jenis='${j}';renderSheet()">${j}</button>`).join('')}</div></div>
  <div class="row2 mb14">
    <div><label style="font-size:12px;color:var(--muted);display:block;margin-bottom:6px">Tarikh</label><input type="date" value="${d.date}" onchange="draft.date=this.value"></div>
    <div></div>
  </div>
  <div class="switchrow"><div class="sl">Tax — Maybe boleh claim?<small>${c.t?('Relief: '+c.t):'Kategori ni biasanya tak berkaitan relief'}</small></div>
    <div class="sw ${d.tax?'on':''}" onclick="draft.tax=!draft.tax;renderSheet()"></div></div>
  <div class="rcptbtn" onclick="${d.rcpt?`viewRcpt()`:`$('camin').click()`}">
    ${d.rcpt?`<img src="${d.rcpt}"><div>Resit dilampirkan ✓<br><span style="font-size:11px" onclick="event.stopPropagation();draft.rcpt=null;draft.hasRcpt=false;renderSheet()">Tap sini untuk buang</span></div>`
    :`<span style="font-size:20px">📷</span><div>Snap / upload resit <span style="font-size:11px;display:block">optional — auto compress</span></div>`}
  </div>
  <div class="field"><label>Nota (optional)</label><input type="text" value="${esc(d.note)}" oninput="draft.note=this.value"></div>
  <button class="btn" onclick="saveExp()">${d.id?'Simpan perubahan':'Simpan ✓'}</button>`;
}
function pickCat(n){const c=catOf(n);draft.cat=n;draft.jenis=c.j;draft.tax=!!c.t;draft.relief=c.t;renderSheet()}
function viewRcpt(){$('vimg').src=draft.rcpt;$('viewer').classList.add('show')}
function closeSheet(){$('ovl').classList.remove('show');$('sheet').classList.remove('show');draft=null}

$('camin').addEventListener('change',function(){
  const f=this.files[0];this.value='';if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const img=new Image();
    img.onload=()=>{const max=900,sc=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');cv.width=img.width*sc;cv.height=img.height*sc;
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      draft.rcpt=cv.toDataURL('image/jpeg',0.72);draft.hasRcpt=true;renderSheet();};
    img.src=r.result;};
  r.readAsDataURL(f);
});

async function saveExp(){
  const d=draft;const amt=+d.amt;
  if(!amt||amt<=0){toast('Masukkan jumlah dulu');return}
  const relief=d.tax?(catOf(d.cat).t||'Gaya Hidup'):null;
  if(d.id){const e=S.expenses.find(x=>x.id===d.id);
    Object.assign(e,{amt,item:d.item.trim(),cat:d.cat,jenis:d.jenis,date:d.date,tax:d.tax,relief,note:d.note,hasRcpt:!!d.rcpt||d.hasRcpt});
    if(d.rcpt)await saveReceipt(e.id,d.rcpt);
    if(!d.rcpt&&!d.hasRcpt)await delReceipt(e.id);
  }else{const id=uid();
    S.expenses.push({id,ts:Date.now(),date:d.date,item:d.item.trim(),cat:d.cat,jenis:d.jenis,amt,tax:d.tax,relief,note:d.note,hasRcpt:!!d.rcpt,cmId:null});
    if(d.rcpt)await saveReceipt(id,d.rcpt);
  }
  save();closeSheet();
  if(!d.id&&d.date.startsWith(month)===false)month=d.date.slice(0,7);
  render();toast('Disimpan ✓');
}
async function delExp(){if(!draft.id)return;
  await delReceipt(draft.id);
  S.expenses=S.expenses.filter(e=>e.id!==draft.id);
  save();closeSheet();render();toast('Dipadam')}

/* ================= EXPORT / RESET ================= */
function exportCSV(){
  const rows=[['Tarikh','Item','Kategori','Jenis','Jumlah','Tax','Relief','Nota']];
  S.expenses.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>
    rows.push([e.date,e.item,e.cat,e.jenis,e.amt,e.tax?'Maybe':'Tidak',e.relief||'',e.note||'']));
  const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));
  a.download='doooit_backup.csv';a.click();
}
async function resetAll(){
  if(!confirm('Padam SEMUA data Doooit dalam phone ni? (Data dalam Drive tak terjejas)'))return;
  for(const e of S.expenses)if(e.hasRcpt)await delReceipt(e.id);
  const keepSync=S.sync;
  S={income:0,expenses:[],commitments:[],sync:keepSync};
  lsSet('doooit-main',JSON.stringify(S));
  render();toast('Data dipadam');
}

/* viewer for saved receipts from list (open via edit sheet) */
load();
</script>
